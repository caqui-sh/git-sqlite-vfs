name: Release Prebuilt Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: git-sqlite-vfs-${{ github.event.release.tag_name }}-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            artifact_name: git-sqlite-vfs-${{ github.event.release.tag_name }}-linux-arm64.tar.gz
          - os: macos-latest
            artifact_name: git-sqlite-vfs-${{ github.event.release.tag_name }}-darwin-x64.tar.gz
          - os: macos-14 # ARM64
            artifact_name: git-sqlite-vfs-${{ github.event.release.tag_name }}-darwin-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile C Extension and Native Strategy
        run: |
          cd package/c
          make clean
          make

      - name: Package Artifacts
        run: |
          cd package/c/output
          # We pack gitvfs.so, git-merge-sqlitevfs 
          # Note: MacOS generates .dylib by default if not careful, but our makefile generates .so
          # which is perfectly fine for Node loadExtension as long as the OS accepts it.
          tar -czvf ../../../${{ matrix.artifact_name }} gitvfs.so git-merge-sqlitevfs

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: git-sqlite-vfs-*.tar.gz
