name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for sqlite download script)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'

      - name: Build C Binaries
        run: make

      - name: Run Tests
        run: |
          cd tests
          deno test -A --unstable-ffi
